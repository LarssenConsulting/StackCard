openapi: 3.0.3
info:
  title: StackCard, API de lecture
  version: 1.0.0
  description: |
    Inventaire des serveurs et de leurs middlewares, pour évaluer leur exposition à une CVE.
    L'API est en **lecture seule** et ne donne aucun verdict : l'évaluation revient au consommateur.

    ## Accès

    Deux conditions cumulatives, définies par l'administrateur de StackCard :

    1. un **jeton** `Authorization: Bearer <jeton>`, valable 365 jours au plus ;
    2. une **adresse IP autorisée** pour ce jeton : toute autre adresse reçoit un `403`, même avec un bon jeton.

    Appelez l'API **depuis votre serveur, jamais depuis le navigateur** : le jeton y serait exposé et l'adresse
    serait celle du visiteur. Traitez le jeton comme un mot de passe d'administration : ces données sont la
    carte des serveurs (versions, comptes, ports, chemins).

    Limite : **120 requêtes par minute** par adresse. Au-delà, `429` avec un en-tête `Retry-After`.

    ## Évaluer une CVE sans se tromper

    - **`null` veut dire « non lu », jamais « non exposé ».** Une liste vide veut dire « lu, rien trouvé ».
      Consultez toujours `error` et `source_errors` avant de conclure.
    - **Vérifiez la fraîcheur.** `stale` indique un serveur muet depuis plus de 3 h, et `collected_at` la date de
      collecte d'une section. Les sections `integrity` et `code_patterns` ne sont collectées que chaque semaine.
    - **Comparez la version complète du paquet** (`3.0.13-0ubuntu3.5`) à l'avis de sécurité de la distribution,
      en suivant la logique de comparaison de dpkg. Ubuntu corrige des failles sans changer la version amont :
      comparer seulement `3.0.13` donnerait de faux positifs.
    - **Une version corrigée installée ne suffit pas toujours.** Un service peut tourner avec l'ancienne
      bibliothèque : consultez `restart_needed`, et `kernel.reboot_required` pour le noyau.
    - **Un pare-feu vide ne prouve pas qu'un port est exposé :** celui de l'hébergeur reste invisible.
    - **Le masquage des secrets est au mieux de ses moyens.** Les valeurs libres sont masquées (`***`), mais un
      secret sous une forme inconnue peut passer : ne republiez pas ces données.

    ## Évolution

    De nouveaux champs peuvent apparaître sans changement de version : ignorez ceux que vous ne connaissez pas.
    Une section dépend de la version de l'agent du serveur (`agent_version`) : une section absente figure dans
    `sections_never_received`.
servers:
  - url: https://{central}
    description: Le central StackCard
    variables:
      central:
        default: stackcard.example.com
        description: Adresse communiquée par l'administrateur
security:
  - bearerAuth: []
tags:
  - name: Serveurs
    description: Identité et état courant des serveurs
  - name: Sections
    description: État détaillé d'un serveur, section par section
  - name: Domaines
    description: Noms de domaine servis par la flotte
  - name: Mises à jour
    description: Mises à jour APT en attente et versions de paquets installées
  - name: Ansible
    description: Inventaire dynamique pour Ansible / Semaphore UI
paths:
  /api/v1/servers:
    get:
      tags: [Serveurs]
      operationId: listServers
      summary: Lister les serveurs
      responses:
        '200':
          description: Tous les serveurs, y compris ceux en attente d'enrôlement ou révoqués (voir `status`).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/servers/{server}:
    get:
      tags: [Serveurs]
      operationId: getServer
      summary: Détailler un serveur
      description: État courant du serveur et état de chaque section, sans son contenu. Pour le contenu, voir la route des sections.
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: Le serveur
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServerDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/servers/{server}/sections/{section}:
    get:
      tags: [Sections]
      operationId: getServerSection
      summary: Lire le dernier état d'une section
      description: |
        Contenu de `data` selon la section. Sauf mention contraire, un champ `null` signifie « non lu », avec une
        entrée dans `source_errors`. Les dates sont en UTC.

        | Section | `data` |
        |---|---|
        | `packages` | Liste des paquets dpkg installés : `package`, `version`, `arch`, `source_package`, `source_version`, `status`, `installed_at`. |
        | `apt_sources` | `{sources, origins, pro}`. `sources` : `[{file, uri, suite, components}]`. `origins` : pour `php*`, `nodejs`, `apache2`, `libbrotli1`, `linux-image-*`, `docker-ce`, `[{package, version, origins: [{uri, suite}]}]`. `pro` : `{attached, services: [{name, status}]}`, l'état d'Ubuntu Pro. |
        | `apt_updates` | `{cache_updated_at, upgrades, held}`. `cache_updated_at` : date du dernier `apt-get update` réussi (`null` si inconnue). `upgrades` : mises à jour en attente `[{package, arch, installed, candidate, origins, security}]` (`installed` vaut `null` pour un nouveau paquet, `origins` liste les suites d'origine, `security` est vrai pour une suite de sécurité), `null` si non lu. `held` : paquets en `apt-mark hold`, `null` si non lu. Une entrée `source_errors.apt_update` (`locked`, `timeout` ou message) signale un `apt-get update` non effectué : lire alors `cache_updated_at`. |
        | `kernel` | `{running, installed, reboot_required, reboot_required_pkgs, boot_time, livepatch}`. `livepatch` : `{kernel, running, check_state, patch_state, version, fixes: [{name, patched}]}`. |
        | `restart_needed` | `{needrestart, masters}`. `needrestart` : `{kernel_current, kernel_expected, kernel_status, services}`. `masters` : processus maîtres `php-fpm*` et `apache2`, `[{comm, pid, started_at}]`. |
        | `kernel_surface` | `{sysctl, modules, modprobe}`. `sysctl` : `{clé: valeur}` pour une liste de clés sensibles, `null` pour un sysctl inexistant. `modules` : modules chargés. `modprobe` : lignes `blacklist` et `install`. |
        | `network` | `{sockets, mptcp_listeners, nft, iptables, iptables_legacy, fail2ban, ufw, services}`. `sockets` : ports en écoute, `[{protocol, address, port, process, pid, public}]`, `public` vaut `false` pour le loopback. `nft` : JSON de `nft -j list ruleset`, sans compteurs. `iptables` et `iptables_legacy` : `{v4, v6}`, les lignes de `iptables-save` dans leur ordre d'application. `fail2ban` : `{enabled, active, jails, config_errors}`, jamais les IP bannies. `ufw` : `{status, logging, default_incoming, default_outgoing, default_routed, rules}`. `services` : services de mitigation `[{name, enabled, active}]`. |
        | `php` | `{versions, sites}`. `versions` : `[{version, sapis, pools}]`. `sapis` : `fpm`, `apache2`, `cli`, chacun `{active, source, values, php_version, build_date, extensions}`. `values` : toutes les directives ini. `extensions` : `[{name, versions}]`, dont les bibliothèques liées (OpenSSL, libxml, cURL). `pools` : `[{name, file, listen, listen_allowed_clients, user, group, php_values, settings}]`. `sites` : `[{server_name, port, document_root, type, php_version, mode, pool, allow_override}]`. Pour `apache2` (mod_php), `values` ne contient que ce qu'écrivent les fichiers ini : une clé `null` signifie « absente des fichiers », pas « désactivée » ; `php_version`, `build_date` et `extensions` y valent toujours `null`. |
        | `apache` | `{modules, vhosts, directives}`. `vhosts` : `[{server_name, port, file, line}]`. `directives` : `[{file, line, directive, value, enabled}]` pour `Protocols`, `VirtualDocumentRoot`, `LimitRequestFieldSize`, `AllowOverride`. |
        | `site_dependencies` | `[{app_dir, sites: [{server_name, port}], composer, applications}]`. `composer` : `[{name, version, dev}]`. `applications` : WordPress et phpMyAdmin, `[{name, version}]`. |
        | `node_apps` | `{apps: [{name, version, exe, exe_deleted, node_version, listen, user, group, app_dir, process_manager, technologies, dependencies}]}`. `dependencies` : `[{name, version}]`. |
        | `docker` | `{version, images, containers}`. `images` : `[{repository, tag, digest, created}]`. `containers` : `[{name, image, image_id, image_digest, state, ports}]`. |
        | `persistence` | `{crons, units, users, authorized_keys, sudoers, github_runners}`, pour repérer une persistance après compromission. `crons` : `[{file, user, ignored, line}]`. `units` : unités systemd hors paquet, `[{name, path, exec_start, drop_in}]`. `users` : `[{name, uid, shell, home}]`. `authorized_keys` : `[{user, file, type, fingerprint, certificate, comment}]`. `sudoers` : `[{file, ignored, line}]`. `github_runners` : `[{service, directory, version}]`. |
        | `integrity` (hebdomadaire) | `{changed, missing, modules_checked}`. `changed` : fichiers de paquets modifiés selon `debsums`, `[{path, package, sensitive}]`. `missing` : nombre de fichiers manquants. Si `modules_checked` vaut `false`, un module noyau altéré n'apparaît pas dans `changed`. |
        | `code_patterns` (hebdomadaire) | `{matches, skipped_files, missing_roots, truncated, reason}`. `matches` : motifs trouvés dans les sites, `[{path, line, pattern}]`, jamais le contenu de la ligne. Si `truncated` vaut `true`, la recherche est incomplète (`reason` : `max_matches` ou `deadline`). |
      parameters:
        - $ref: '#/components/parameters/Server'
        - name: section
          in: path
          required: true
          description: Nom de la section
          schema:
            $ref: '#/components/schemas/SectionName'
      responses:
        '200':
          description: Le dernier état reçu de la section
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Section'
              examples:
                lue:
                  summary: Section lue
                  value:
                    data:
                      server_id: 1
                      section: packages
                      collected_at: '2026-11-01T08:00:00.000000Z'
                      first_seen_at: '2026-10-30T08:00:00.000000Z'
                      last_seen_at: '2026-11-01T08:00:00.000000Z'
                      sha256: 94977bb3632e1dc61346d39c69d90630e4574a0cfb19abe321454dadfa8739ac
                      error: null
                      source_errors: {}
                      data:
                        - package: openssl
                          version: 3.0.13-0ubuntu3.5
                          arch: amd64
                          source_package: openssl
                          source_version: 3.0.13-0ubuntu3.5
                          status: ii
                          installed_at: '2026-10-15T06:03:59Z'
                nonLue:
                  summary: Section non lue, à ne pas prendre pour une absence d'exposition
                  value:
                    data:
                      server_id: 1
                      section: integrity
                      collected_at: '2026-11-01T08:00:00.000000Z'
                      first_seen_at: '2026-11-01T08:00:00.000000Z'
                      last_seen_at: '2026-11-01T08:00:00.000000Z'
                      sha256: null
                      error: not_installed
                      source_errors: {}
                      data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Serveur ou section inconnus, ou section jamais reçue de ce serveur.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/servers/{server}/updates:
    get:
      tags: [Mises à jour]
      operationId: getServerUpdates
      summary: Mises à jour APT en attente d'un serveur
      description: |
        Les mises à jour en attente (triées par paquet), les paquets retenus (`held`) et les paquets qui
        réclament un redémarrage. `updates_state` dit si la liste est fiable : `unknown` (aucune donnée reçue),
        `stale` (cache APT de plus de 24 h ou à une date future, ou dernière collecte en erreur : les lignes sont celles de la dernière
        collecte réussie), `ok`. Un `null` signifie « non lu ».
      parameters:
        - $ref: '#/components/parameters/Server'
      responses:
        '200':
          description: Les mises à jour du serveur
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ServerUpdates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/updates:
    get:
      tags: [Mises à jour]
      operationId: listFleetUpdates
      summary: Mises à jour en attente de la flotte
      description: |
        Une entrée par couple (paquet, version candidate), triée par paquet, avec les serveurs concernés.
        Les serveurs révoqués sont exclus. Chaque serveur porte son `updates_state` : une liste `stale` peut
        être périmée. La réponse n'est pas paginée.
      parameters:
        - name: security
          in: query
          required: false
          description: "`1` pour ne garder que les mises à jour de sécurité."
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
        - name: package
          in: query
          required: false
          description: Nom exact d'un paquet.
          schema:
            type: string
            example: libssl3t64
      responses:
        '200':
          description: Les mises à jour
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetUpdate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/packages:
    get:
      tags: [Mises à jour]
      operationId: findPackage
      summary: Où est installé un paquet, et dans quelle version
      description: |
        Pour chaque serveur non révoqué qui a le paquet : la version installée (celle de la mise à jour en
        attente, sinon celle de la dernière section `packages`) et, si une mise à jour existe, la version
        candidate. `candidate_version` et `security` valent `null` quand le paquet n'a pas de mise à jour en
        attente : seul `updates_state` à `ok` autorise à conclure qu'il est à jour. Un serveur sans ce paquet
        est absent de la réponse, mais l'absence peut aussi signifier « paquets non lus » (aucune section `packages`
        valide reçue de ce serveur) : voir `packages_collected_at` des autres serveurs et `/servers/{server}/sections/packages`.
      parameters:
        - name: name
          in: query
          required: true
          description: Nom du paquet Debian (minuscules, chiffres, `.`, `+`, `-`).
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9.+-]+$'
            example: openssl
      responses:
        '200':
          description: Les serveurs qui ont ce paquet
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackageLocation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/domains:
    get:
      tags: [Domaines]
      operationId: listDomains
      summary: Lister les noms de domaine de la flotte
      description: |
        Une entrée par nom de domaine (en minuscules, triés), avec chaque vhost Apache qui le sert. Les
        emplacements sont triés par slug du serveur puis par port. Les serveurs révoqués sont exclus.
        Un `server_stale` à `true` signale un serveur muet depuis plus de 3 h : l'emplacement peut avoir changé.
      parameters:
        - name: server
          in: query
          required: false
          description: Slug d'un serveur, pour ne garder que ses domaines. Un slug inconnu renvoie une liste vide.
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
            example: web01
      responses:
        '200':
          description: Les domaines
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Domain'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/inventory/ansible:
    get:
      tags: [Ansible]
      operationId: getAnsibleInventory
      summary: Inventaire dynamique Ansible
      description: |
        Format `--list` d'un inventaire dynamique Ansible. Les hôtes sont nommés par leur slug StackCard ;
        seuls les serveurs actifs ayant une adresse (manuelle, sinon celle remontée par l'agent) sont listés.
        `ansible_port` n'est présent que si un port de connexion est défini. Groupes dérivés, émis seulement
        s'ils ne sont pas vides : `ubuntu_XX_YY`, `apache`, `mysql`, `docker`, `stale` (serveur muet depuis plus de 3 h),
        `updates_pending`, `security_updates` et `reboot_required` (mises à jour APT, d'après les dernières données connues
        même périmées ; un serveur dont `stackcard_updates_state` vaut `unknown` n'est dans aucun de ces trois groupes).
        Le groupe `all` liste tous les hôtes et les groupes dérivés. Le script `docs/ansible/stackcard_inventory.py` s'en sert.
      responses:
        '200':
          description: L'inventaire
          content:
            application/json:
              schema:
                type: object
                required: [_meta, all]
                properties:
                  _meta:
                    type: object
                    required: [hostvars]
                    properties:
                      hostvars:
                        type: object
                        description: Variables par slug de serveur.
                        additionalProperties:
                          type: object
                          required: [ansible_host, stackcard_id, stackcard_name, stackcard_stale]
                          properties:
                            ansible_host: {type: string, example: 203.0.113.5}
                            ansible_port: {type: integer, example: 2222}
                            stackcard_id: {type: integer, example: 1}
                            stackcard_name: {type: string, example: web01}
                            stackcard_hostname: {type: string, nullable: true}
                            stackcard_fqdn: {type: string, nullable: true}
                            stackcard_os: {type: string, nullable: true, example: Ubuntu 24.04.1 LTS}
                            stackcard_stale: {type: boolean}
                            stackcard_last_seen_at: {type: string, format: date-time, nullable: true, description: ISO 8601, UTC}
                            stackcard_updates_state: {type: string, enum: [ok, stale, unknown]}
                            stackcard_updates_pending: {type: integer, nullable: true, description: Mises à jour APT en attente ; null si `unknown`.}
                            stackcard_security_updates_pending: {type: integer, nullable: true, description: Dont mises à jour de sécurité ; null si `unknown`.}
                            stackcard_reboot_required: {type: boolean, nullable: true, description: Redémarrage requis ; null si `unknown`.}
                  all:
                    type: object
                    required: [hosts, children]
                    properties:
                      hosts:
                        type: array
                        items: {type: string}
                      children:
                        type: array
                        items: {type: string}
                additionalProperties:
                  type: object
                  description: Un groupe dérivé (`apache`, `docker`, `mysql`, `reboot_required`, `security_updates`, `stale`, `ubuntu_XX_YY`, `updates_pending`).
                  properties:
                    hosts:
                      type: array
                      items: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Jeton fourni par l'administrateur de StackCard, valable depuis les adresses IP déclarées.
  parameters:
    Server:
      name: server
      in: path
      required: true
      description: Identifiant numérique ou slug du serveur, tels que renvoyés par la liste (`id` ou `slug`)
      schema:
        type: string
        pattern: '^[a-z0-9-]+$'
        example: web01
  responses:
    Invalid:
      description: Paramètre manquant ou invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Jeton absent, invalide, expiré ou révoqué.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Adresse IP non autorisée pour ce jeton, ou jeton sans droit de lecture.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Serveur inconnu.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Plus de 120 requêtes par minute depuis cette adresse.
      headers:
        Retry-After:
          description: Nombre de secondes à attendre
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    SectionName:
      type: string
      enum:
        - packages
        - apt_sources
        - apt_updates
        - kernel
        - restart_needed
        - kernel_surface
        - network
        - php
        - apache
        - site_dependencies
        - node_apps
        - docker
        - persistence
        - integrity
        - code_patterns
    Domain:
      type: object
      required: [domain, locations]
      properties:
        domain:
          type: string
          description: Nom de domaine en minuscules
          example: shop.example.com
        locations:
          type: array
          items:
            type: object
            required: [source, server, server_stale, role, port, https]
            properties:
              source:
                type: string
                enum: [apache]
              server:
                type: object
                required: [slug, name]
                properties:
                  slug:
                    type: string
                    nullable: true
                  name:
                    type: string
              server_stale:
                type: boolean
                description: Vrai si le serveur est muet depuis plus de 3 h.
              role:
                type: string
                enum: [server_name, alias]
                description: "`server_name` pour le ServerName du vhost, `alias` pour un ServerAlias."
              port:
                type: integer
              https:
                type: boolean
              cert_expires_at:
                type: string
                format: date-time
                nullable: true
              type:
                type: string
                enum: [php-fpm, php-mod, node, docker, proxy, static]
              document_root:
                type: string
                nullable: true
              app_dir:
                type: string
                nullable: true
              upstream:
                type: string
                nullable: true
              php_version:
                type: string
                nullable: true
              technologies:
                type: array
                nullable: true
                description: CMS et frameworks détectés
                items:
                  type: object
    ServerUpdates:
      type: object
      required: [slug, updates_state, apt_cache_updated_at, updates_received_at, updates_error, reboot_required, reboot_required_packages, held, collected_at, source_errors, updates]
      properties:
        slug:
          type: string
          nullable: true
        updates_state:
          type: string
          enum: [unknown, stale, ok]
        apt_cache_updated_at:
          type: string
          format: date-time
          nullable: true
        updates_received_at:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière collecte réussie.
        updates_error:
          type: string
          nullable: true
          description: Erreur de la dernière collecte, le cas échéant (les lignes restent celles de la dernière réussie).
        reboot_required:
          type: boolean
          nullable: true
        reboot_required_packages:
          type: array
          nullable: true
          description: Paquets qui réclament le redémarrage (dernière section `kernel`). `null` si non lu.
          items:
            type: string
        held:
          type: array
          nullable: true
          description: Paquets retenus (`apt-mark hold`). `null` si non lu.
          items:
            type: string
        collected_at:
          type: string
          format: date-time
          nullable: true
          description: Date de collecte de la dernière section `apt_updates` valide. `null` si aucune.
        source_errors:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: Erreurs de sources de cette section (par exemple `apt_update` valant `locked` quand `apt-get update` n'a pas pu tourner). `null` si aucune section valide.
        updates:
          type: array
          items:
            type: object
            required: [package, arch, installed_version, candidate_version, security, origins]
            properties:
              package:
                type: string
              arch:
                type: string
                nullable: true
              installed_version:
                type: string
                nullable: true
              candidate_version:
                type: string
              security:
                type: boolean
              origins:
                type: array
                items:
                  type: string
                example: [noble-security]
    FleetUpdate:
      type: object
      required: [package, candidate_version, security, installed_versions, servers]
      properties:
        package:
          type: string
        candidate_version:
          type: string
        security:
          type: boolean
        installed_versions:
          type: array
          description: Versions installées distinctes (triées) sur les serveurs concernés.
          items:
            type: string
        servers:
          type: array
          items:
            type: object
            required: [slug, name, installed_version, updates_state]
            properties:
              slug:
                type: string
                nullable: true
              name:
                type: string
              installed_version:
                type: string
                nullable: true
              updates_state:
                type: string
                enum: [unknown, stale, ok]
    PackageLocation:
      type: object
      required: [slug, name, os, installed_version, candidate_version, security, updates_state, apt_cache_updated_at, packages_collected_at]
      properties:
        slug:
          type: string
          nullable: true
        name:
          type: string
        os:
          type: string
          nullable: true
        installed_version:
          type: string
          nullable: true
        candidate_version:
          type: string
          nullable: true
          description: "`null` : pas de mise à jour en attente connue pour ce paquet."
        security:
          type: boolean
          nullable: true
          description: "`null` quand le paquet n'a pas de mise à jour en attente."
        updates_state:
          type: string
          enum: [unknown, stale, ok]
        apt_cache_updated_at:
          type: string
          format: date-time
          nullable: true
        packages_collected_at:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière section `packages` reçue ; `null` si aucune.
    ServerSummary:
      type: object
      required: [id, name, slug, slug_locked, status, updates_state, updates_pending, security_updates_pending, reboot_required, apt_cache_updated_at, stale]
      properties:
        id:
          type: integer
        name:
          type: string
          description: Nom d'affichage
        slug:
          type: string
          nullable: true
          description: Identifiant stable du serveur, utilisable à la place de `id` dans les chemins. Minuscules, chiffres et tirets.
          example: web01
        slug_locked:
          type: boolean
          description: Vrai si le slug est verrouillé et ne change plus.
        connect_address:
          type: string
          nullable: true
          description: Adresse (IP ou nom) à utiliser pour se connecter au serveur.
        connect_port:
          type: integer
          nullable: true
          description: Port de connexion.
        ansible_excluded:
          type: boolean
          description: Exclu de l'inventaire Ansible par un admin (le serveur reste dans les autres réponses).
        approved_ip:
          type: string
          nullable: true
          description: >-
            IP principale validée : fixée au premier inventaire, puis changée seulement par un admin.
            Quand `primary_ip` en diffère, l'inventaire Ansible ignore le serveur (sauf `connect_address`).
        hostname:
          type: string
          nullable: true
        fqdn:
          type: string
          nullable: true
        status:
          type: string
          description: '`pending` : jamais enrôlé. `active` : enrôlé. `revoked` : révoqué.'
          enum: [pending, active, revoked]
        primary_ip:
          type: string
          nullable: true
        os:
          type: string
          nullable: true
          example: Ubuntu 24.04.1 LTS
        kernel:
          type: string
          nullable: true
        virtualization:
          type: string
          nullable: true
        apache_version:
          type: string
          nullable: true
        mysql_version:
          type: string
          nullable: true
        docker_version:
          type: string
          nullable: true
        agent_version:
          type: string
          nullable: true
          example: 0.5.2
        last_seen_at:
          type: string
          format: date-time
          nullable: true
          description: Date du dernier envoi de l'agent
        updates_state:
          type: string
          enum: [unknown, stale, ok]
          description: >-
            `unknown` : aucune donnée de mises à jour reçue. `stale` : cache APT de plus de 48 h ou dernière
            collecte en erreur. `ok` : données fraîches.
        updates_pending:
          type: integer
          nullable: true
          description: Nombre de mises à jour en attente. `null` quand `updates_state` vaut `unknown`.
        security_updates_pending:
          type: integer
          nullable: true
          description: Dont mises à jour de sécurité. `null` quand `updates_state` vaut `unknown`.
        reboot_required:
          type: boolean
          nullable: true
          description: Vrai si le serveur réclame un redémarrage ; `null` si non lu.
        apt_cache_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Date de la dernière actualisation de l'index APT du serveur.
        stale:
          type: boolean
          description: Vrai si le serveur est muet depuis plus de 3 h ou n'a jamais envoyé.
    ServerDetail:
      allOf:
        - $ref: '#/components/schemas/ServerSummary'
        - type: object
          required: [ips, sites, node_apps, docker_containers, firewall, databases, db_users, sections, sections_never_received]
          properties:
            ips:
              type: array
              items:
                type: object
                properties:
                  interface:
                    type: string
                  address:
                    type: string
                  prefix:
                    type: integer
                    nullable: true
            sites:
              type: array
              items:
                $ref: '#/components/schemas/Site'
            node_apps:
              type: array
              items:
                $ref: '#/components/schemas/NodeApp'
            docker_containers:
              type: array
              items:
                $ref: '#/components/schemas/DockerContainer'
            firewall:
              $ref: '#/components/schemas/Ufw'
            databases:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  size_bytes:
                    type: integer
                    nullable: true
            db_users:
              type: array
              items:
                type: object
                description: Comptes MySQL ou MariaDB, jamais de hash de mot de passe.
                properties:
                  user:
                    type: string
                  host:
                    type: string
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        database:
                          type: string
                          nullable: true
                          description: '`null` pour un droit global'
                        global:
                          type: boolean
                        privileges:
                          type: array
                          items:
                            type: string
            sections:
              type: object
              description: État de chaque section reçue, par nom, sans `data`.
              additionalProperties:
                $ref: '#/components/schemas/SectionState'
            sections_never_received:
              type: array
              description: Sections jamais reçues de ce serveur, par exemple avec un agent ancien.
              items:
                $ref: '#/components/schemas/SectionName'
    Site:
      type: object
      properties:
        server_name:
          type: string
          nullable: true
        aliases:
          type: array
          nullable: true
          items:
            type: string
        port:
          type: integer
          nullable: true
        https:
          type: boolean
        cert_expires_at:
          type: string
          format: date-time
          nullable: true
        type:
          type: string
          description: '`php-fpm`, `php-mod`, `node`, `docker`, `proxy` ou `static`, entre autres.'
        document_root:
          type: string
          nullable: true
        app_dir:
          type: string
          nullable: true
        upstream:
          type: string
          nullable: true
        php_version:
          type: string
          nullable: true
        system_user:
          type: string
          nullable: true
        system_group:
          type: string
          nullable: true
        owner_user:
          type: string
          nullable: true
        owner_group:
          type: string
          nullable: true
        process_manager:
          type: string
          nullable: true
        config_file:
          type: string
          nullable: true
        partial:
          type: boolean
          description: Vrai si la configuration du site n'a pu être lue qu'en partie.
        technologies:
          type: array
          nullable: true
          description: CMS et frameworks détectés
          items:
            type: object
        db_refs:
          type: array
          description: Bases référencées par le site, jamais de mot de passe.
          items:
            type: object
            properties:
              db_name:
                type: string
                nullable: true
              db_user:
                type: string
                nullable: true
              db_host:
                type: string
                nullable: true
              source:
                type: string
                nullable: true
    NodeApp:
      type: object
      properties:
        name:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        node_version:
          type: string
          nullable: true
        listen:
          type: array
          nullable: true
          items:
            type: object
        user:
          type: string
          nullable: true
        group:
          type: string
          nullable: true
        app_dir:
          type: string
          nullable: true
        process_manager:
          type: string
          nullable: true
        technologies:
          type: array
          nullable: true
          items:
            type: object
    DockerContainer:
      type: object
      properties:
        name:
          type: string
          nullable: true
        image:
          type: string
          nullable: true
        image_version:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        ports:
          type: array
          nullable: true
          items:
            type: object
        compose_project:
          type: string
          nullable: true
        compose_service:
          type: string
          nullable: true
        compose_dir:
          type: string
          nullable: true
        restart_policy:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
    Ufw:
      type: object
      description: État d'UFW. Pour nftables, iptables et Fail2Ban, voir la section `network`.
      properties:
        status:
          type: string
          nullable: true
          description: '`null` si UFW n''est pas installé ou pas remonté.'
        logging:
          type: string
          nullable: true
        default_incoming:
          type: string
          nullable: true
        default_outgoing:
          type: string
          nullable: true
        default_routed:
          type: string
          nullable: true
        rules:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              destination:
                type: string
              action:
                type: string
              source:
                type: string
              ipv6:
                type: boolean
              comment:
                type: string
                nullable: true
    SectionState:
      type: object
      required: [first_seen_at, last_seen_at]
      properties:
        collected_at:
          type: string
          format: date-time
          nullable: true
          description: Date de la collecte sur le serveur
        first_seen_at:
          type: string
          format: date-time
          description: Depuis quand cet état est observé
        last_seen_at:
          type: string
          format: date-time
          description: Dernier envoi où cet état était encore valable
        sha256:
          type: string
          nullable: true
          description: Empreinte de `data`. Elle ne change que si l'état change, donc utile pour éviter de relire une section.
        error:
          type: string
          nullable: true
          description: '`null` si lue, sinon `timeout`, `not_installed`, `too_large` ou un message. `data` vaut alors `null`.'
        source_errors:
          type: object
          nullable: true
          description: Sous-sources non lues d'une section par ailleurs collectée. Leur champ dans `data` vaut `null`.
          additionalProperties:
            type: string
          example:
            nft: not_installed
    Section:
      allOf:
        - $ref: '#/components/schemas/SectionState'
        - type: object
          required: [server_id, section]
          properties:
            server_id:
              type: integer
            section:
              $ref: '#/components/schemas/SectionName'
            data:
              description: Contenu de la section, liste ou objet, voir le tableau de cette route. `null` si `error` est renseigné.
